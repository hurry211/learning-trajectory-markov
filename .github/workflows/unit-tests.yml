name: Synthetic implementation checks
on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/**'
      - 'tests/**'
      - 'paper_output/code/**'
      - 'requirements.txt'
      - '.github/workflows/unit-tests.yml'
permissions:
  contents: read
jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s paper_output/code/modeling/tests -v
